<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Een klein moment van verwondering. Eerst een onverwacht beeld, dan een open vraag.">
  <title>ONMOGELIJK? — Even anders kijken.</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header><a class="wordmark" href="./" aria-label="ONMOGELIJK? — terug naar het begin">ONMOGELIJK<span>?</span></a><span class="edition">EEN ANDERE BLIK · V0.1</span></header>
  <main>
    <section id="intro" class="intro" aria-labelledby="title">
      <p class="eyebrow">EEN KLEIN MOMENT VAN VERWONDERING</p>
      <h1 id="title">ONMOGELIJK<span>?</span></h1>
      <p class="subtitle">Even anders kijken.</p>
      <div class="intro-mark" aria-hidden="true"><span></span><i></i></div>
      <button id="start" class="primary" disabled>Verras me! <span aria-hidden="true">↗</span></button>
      <p class="hint">Eerst een beeld. Dan een vraag.<br>Alle ruimte om zelf te kijken.</p>
    </section>
    <section id="experience" class="experience" hidden aria-label="Een andere blik">
      <figure>
        <div class="image-wrap"><img id="card-image" alt="" width="1200" height="800"><span id="card-label" class="placeholder-label">TIJDELIJKE PROEFKAART <span id="card-number"></span></span></div>
        <figcaption><span>KIJK MAAR EVEN.</span><span>JE HOEFT NIETS OP TE LOSSEN.</span></figcaption>
      </figure>
      <div class="reflection">
        <button id="reveal" class="primary">Ontdek de vraag <span aria-hidden="true">↓</span></button>
        <div id="question-panel" hidden>
          <p class="eyebrow">EEN VRAAG OM BIJ STIL TE STAAN</p>
          <p id="question" class="question" tabindex="-1" aria-live="polite" aria-atomic="true"></p>
          <div class="actions"><button id="another" class="secondary">Andere vraag <span aria-hidden="true">↻</span></button><button id="next" class="primary">Verras me opnieuw! <span aria-hidden="true">↗</span></button></div>
        </div>
      </div>
    </section>
    <p id="status" class="status" role="status">De kaarten worden klaargelegd…</p>
    <noscript><p>Schakel JavaScript in om de kaarten te ontdekken.</p></noscript>
  </main>
  <footer><a href="https://www.jekerntotbloei.nl/">Een initiatief van Je Kern tot Bloei</a><span>Neem de tijd. Kijk nog eens.</span></footer>
</body>
</html>
